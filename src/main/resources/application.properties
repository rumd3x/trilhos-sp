spring.application.name=trilhossp

# H2 R2DBC
spring.r2dbc.url=r2dbc:h2:mem:///trilhossp;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always

# Transit API (ARTESP)
transit.api.base-url=https://ccm.artesp.sp.gov.br/metroferroviario/api/status/
transit.api.key=${TRANSIT_API_KEY}

# Notifications
notify.days=${NOTIFY_DAYS:all}
notify.level=${NOTIFY_LEVEL:0}
notify.lines=${NOTIFY_LINES:all}

# Gotify
gotify.url=${GOTIFY_URL:}
gotify.token=${GOTIFY_TOKEN:}
